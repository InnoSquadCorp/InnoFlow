name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review, converted_to_draft, closed]
  workflow_run:
    workflows: [CI, Dependabot Review Notice, Dependabot Ready]
    types: [requested, in_progress, completed]
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: (github.event_name != 'workflow_run' || github.event.workflow_run.path != '.github/workflows/ci.yml' || github.event.workflow_run.event == 'pull_request') && github.repository == 'InnoSquadCorp/InnoFlow' && github.ref == 'refs/heads/main' && github.workflow_ref == 'InnoSquadCorp/InnoFlow/.github/workflows/dependabot-auto-merge.yml@refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    outputs:
      prs: ${{ steps.targets.outputs.prs }}
      bot_prs: ${{ steps.targets.outputs.bot_prs }}
      manual_prs: ${{ steps.targets.outputs.manual_prs }}
    steps:
      - name: Checkout trusted coordinator only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts
      - name: Resolve authoritative API targets from ${{ github.workflow_sha }}
        id: targets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/dependabot-merge-policy.py targets

  ready-plan:
    needs: [inspect, bot-ready]
    if: always() && (needs.bot-ready.result == 'success' || needs.bot-ready.result == 'skipped') && needs.inspect.result == 'success' && needs.inspect.outputs.prs != '' && needs.inspect.outputs.prs != '[]' && github.repository == 'InnoSquadCorp/InnoFlow' && github.ref == 'refs/heads/main' && github.workflow_ref == 'InnoSquadCorp/InnoFlow/.github/workflows/dependabot-auto-merge.yml@refs/heads/main' && github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
      rejected: ${{ steps.plan.outputs.rejected }}
    steps:
      - name: Checkout trusted coordinator only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts
      - name: Plan exact native Ready refreshes
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBERS: ${{ needs.inspect.outputs.prs }}
          DEPENDABOT_AUTO_MERGE_ENABLED: ${{ vars.DEPENDABOT_AUTO_MERGE_ENABLED }}
        run: python3 -B scripts/dependabot-ready-policy.py plan
      # Each PR is planned in isolation. A PR whose own plan was rejected gets no
      # target and fails this job only after the other verified targets exist.
      - name: Report PR-isolated Ready plan rejections
        if: steps.plan.outputs.rejected != '[]'
        env:
          REJECTED: ${{ steps.plan.outputs.rejected }}
        run: |
          echo "::error::Native Ready plan rejected PRs $REJECTED; they get no refresh until the reported cause is resolved"
          exit 1

  ready-refresh:
    needs: [inspect, ready-plan, bot-ready]
    if: ${{ always() && github.repository == 'InnoSquadCorp/InnoFlow' && github.ref == 'refs/heads/main' && github.workflow_ref == 'InnoSquadCorp/InnoFlow/.github/workflows/dependabot-auto-merge.yml@refs/heads/main' && github.event_name != 'pull_request_target' && needs.inspect.result == 'success' && (needs.ready-plan.result == 'success' || (needs.ready-plan.result == 'failure' && needs.ready-plan.outputs.rejected != '' && needs.ready-plan.outputs.rejected != '[]')) && (needs.bot-ready.result == 'success' || needs.bot-ready.result == 'skipped') && needs.ready-plan.outputs.targets != '[]' && needs.ready-plan.outputs.targets != '' }}
    name: ${{ matrix.target.pr && format('Ready refresh PR{0} run{1} attempt{2}', matrix.target.pr, matrix.target.run, matrix.target.attempt) || 'ready-refresh' }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.ready-plan.outputs.targets) }}
    concurrency:
      group: dependabot-ready-${{ matrix.target.pr }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 11
    permissions:
      contents: read
      actions: write
      checks: read
      pull-requests: read
    steps:
      - name: Checkout trusted coordinator only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts
      # Read-only and holds all verification. Rejection, deferral or this step's
      # own timeout skips the request step, which later claims accept as proof
      # that this claim never POSTed. Every step's budget, checkout included,
      # fits inside the job timeout, so slow earlier steps never cut a request.
      - name: Preflight verified native Ready refresh
        id: preflight
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
          REFRESH_TARGET: ${{ toJSON(matrix.target) }}
          DEPENDABOT_AUTO_MERGE_ENABLED: ${{ vars.DEPENDABOT_AUTO_MERGE_ENABLED }}
        run: python3 -B scripts/dependabot-ready-policy.py preflight
      # Only the POST and its readback: executing this step means a POST was
      # attempted, so an executed step still blocks automatic retries.
      - name: Request verified native Ready refresh
        if: steps.preflight.outputs.request == 'true'
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          REFRESH_TARGET: ${{ toJSON(matrix.target) }}
        run: python3 -B scripts/dependabot-ready-policy.py refresh

  bot-ready:
    needs: inspect
    if: needs.inspect.result == 'success' && github.ref == 'refs/heads/main' && github.workflow_ref == 'InnoSquadCorp/InnoFlow/.github/workflows/dependabot-auto-merge.yml@refs/heads/main' && needs.inspect.outputs.bot_prs != '[]' && needs.inspect.outputs.bot_prs != ''
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.inspect.outputs.bot_prs) }}
    concurrency:
      group: dependabot-ready-${{ matrix.pr }}
      cancel-in-progress: false
      # Keep pending PR reporters; default single-slot queues replace them.
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      checks: read
      pull-requests: write
    steps:
      - name: Checkout trusted coordinator only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts
      - name: Gate native auto-merge on exact current CI proof
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr }}
          DEPENDABOT_AUTO_MERGE_ENABLED: ${{ vars.DEPENDABOT_AUTO_MERGE_ENABLED }}
        run: python3 -B scripts/dependabot-merge-policy.py coordinate --pr "$PR_NUMBER"
      - name: ${{ steps.gate.outputs.arm_receipt || 'No native arm receipt' }}
        if: steps.gate.outputs.arm_receipt != ''
        run: ':'

  post-merge-plan:
    if: ${{ always() && needs.inspect.result == 'success' && github.repository == 'InnoSquadCorp/InnoFlow' && github.ref == 'refs/heads/main' && github.workflow_ref == 'InnoSquadCorp/InnoFlow/.github/workflows/dependabot-auto-merge.yml@refs/heads/main' && vars.DEPENDABOT_AUTO_MERGE_ENABLED == 'true' && ((needs.inspect.outputs.bot_prs != '[]' && needs.inspect.outputs.bot_prs != '') || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    needs: [inspect, bot-ready, ready-refresh]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      needed: ${{ steps.plan.outputs.needed }}
      pr: ${{ steps.plan.outputs.pr }}
      main_sha: ${{ steps.plan.outputs.main_sha }}
    steps:
      - name: Checkout trusted coordinator only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
          sparse-checkout: scripts
      - name: Plan only verified current-main bot recovery
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          DEPENDABOT_AUTO_MERGE_ENABLED: ${{ vars.DEPENDABOT_AUTO_MERGE_ENABLED }}
          WAIT_FOR_BOT_MERGE: ${{ needs.inspect.outputs.bot_prs != '[]' && needs.inspect.outputs.bot_prs != '' }}
        run: python3 -B scripts/dependabot-merge-policy.py post-merge-plan

  post-merge:
    if: ${{ always() && needs.inspect.result == 'success' && needs.post-merge-plan.result == 'success' && needs.post-merge-plan.outputs.needed == 'true' && github.repository == 'InnoSquadCorp/InnoFlow' && github.ref == 'refs/heads/main' && github.workflow_ref == 'InnoSquadCorp/InnoFlow/.github/workflows/dependabot-auto-merge.yml@refs/heads/main' && vars.DEPENDABOT_AUTO_MERGE_ENABLED == 'true' }}
    needs: [inspect, post-merge-plan]
    concurrency:
      group: dependabot-post-merge
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      - name: Checkout trusted coordinator only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
          sparse-checkout: scripts
      - name: Reconcile actual bot merge and only its current-main CI
        env:
          GH_TOKEN: ${{ github.token }}
          DEPENDABOT_AUTO_MERGE_ENABLED: ${{ vars.DEPENDABOT_AUTO_MERGE_ENABLED }}
          PLANNED_MAIN: ${{ needs.post-merge-plan.outputs.main_sha }}
          PLANNED_PR: ${{ needs.post-merge-plan.outputs.pr }}
        run: python3 -B scripts/dependabot-merge-policy.py post-merge --pr "$PLANNED_PR" --expected-sha "$PLANNED_MAIN"

  # A metadata-only CI recheck waits a bounded time for its exact validation.
  # When validation outlasts that wait, rerun the unchanged recheck once that
  # validation succeeds; its own fail-closed verifier still decides the checks.
  metadata-rerun:
    needs: inspect
    if: needs.inspect.result == 'success' && github.repository == 'InnoSquadCorp/InnoFlow' && github.ref == 'refs/heads/main' && github.workflow_ref == 'InnoSquadCorp/InnoFlow/.github/workflows/dependabot-auto-merge.yml@refs/heads/main' && github.event_name != 'pull_request_target' && needs.inspect.outputs.prs != '' && needs.inspect.outputs.prs != '[]'
    concurrency:
      group: ci-metadata-rerun
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      - name: Checkout trusted coordinator only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts
      - name: Rerun metadata rechecks that failed before validation finished
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBERS: ${{ needs.inspect.outputs.prs }}
        run: python3 -B scripts/ci-metadata-rerun.py

  # Hosted macOS capacity shortages cancel queued validation jobs before any step
  # runs. Rerun only those failed jobs, once per validation; the rerun's own jobs
  # still decide every check, and any other failure stays the change's verdict.
  capacity-rerun:
    needs: inspect
    if: needs.inspect.result == 'success' && github.repository == 'InnoSquadCorp/InnoFlow' && github.ref == 'refs/heads/main' && github.workflow_ref == 'InnoSquadCorp/InnoFlow/.github/workflows/dependabot-auto-merge.yml@refs/heads/main' && github.event_name != 'pull_request_target' && needs.inspect.outputs.prs != '' && needs.inspect.outputs.prs != '[]'
    concurrency:
      group: ci-capacity-rerun
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      checks: read
      pull-requests: read
    steps:
      - name: Checkout trusted coordinator only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts
      - name: Rerun validation jobs that never got a hosted runner
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBERS: ${{ needs.inspect.outputs.prs }}
        run: python3 -B scripts/ci-capacity-rerun.py
