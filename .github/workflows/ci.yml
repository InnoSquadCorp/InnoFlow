name: CI
# Metadata events use a separate queue and wait for immutable validation evidence.
# Stable required check names keep GitHub branch protection actionable.
run-name: >-
  ${{ (github.event_name == 'pull_request' && (((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name && github.event.label.name != 'release-validation' && github.event.label.name != 'run-asan') || (github.event.action == 'edited' && !github.event.changes.base))) && format('CI metadata-only v1 pr:{0} head:{1} base:{2} action:{3} source:{4}', github.event.pull_request.number, github.event.pull_request.head.sha, github.event.pull_request.base.sha, github.event.action, github.workflow_sha) || (github.event_name == 'pull_request' && format('CI validation v2 pr:{0} head:{1} base:{2} source:{3} release:{4} asan:{5} concurrency:{6}', github.event.pull_request.number, github.event.pull_request.head.sha, github.event.pull_request.base.sha, github.sha, contains(github.event.pull_request.labels.*.name, 'release-validation'), contains(github.event.pull_request.labels.*.name, 'run-asan'), false) || (inputs.dependabot_merge_pr && format('CI / Dependabot merge #{0}', inputs.dependabot_merge_pr) || format('CI validation / {0} / {1}', github.event_name, github.ref))) }}

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      dependabot_merge_pr:
        description: "Trusted recovery only: actual merged Dependabot PR at current main"
        required: false
        default: ''
        type: string

# Keep only the newest run for a branch or pull request. This is especially
# important for macOS jobs, where stale runs otherwise occupy scarce runners
# long after a newer commit has superseded their evidence. Recovery dispatches
# cannot cancel a native push when main races forward before dispatch admission.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.dependabot_merge_pr != '' && format('dependabot-{0}', inputs.dependabot_merge_pr) || ((github.event_name == 'pull_request' && (((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name && github.event.label.name != 'release-validation' && github.event.label.name != 'run-asan') || (github.event.action == 'edited' && !github.event.changes.base))) && 'metadata' || 'validation') }}
  cancel-in-progress: ${{ !(github.event_name == 'pull_request' && (((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name && github.event.label.name != 'release-validation' && github.event.label.name != 'run-asan') || (github.event.action == 'edited' && !github.event.changes.base))) }}
  queue: ${{ (github.event_name == 'pull_request' && (((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name && github.event.label.name != 'release-validation' && github.event.label.name != 'run-asan') || (github.event.action == 'edited' && !github.event.changes.base))) && 'max' || 'single' }}

permissions:
  contents: read

jobs:
  ci-plan:
    name: CI Plan
    if: ${{ !(github.event_name == 'pull_request' && (((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name && github.event.label.name != 'release-validation' && github.event.label.name != 'run-asan') || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
    outputs:
      reuse-proof: ${{ steps.reuse.outputs.proof }}
      tests: ${{ steps.plan.outputs.tests }}
      release-tests: ${{ steps.plan.outputs.release-tests }}
      thread-sanitizer: ${{ steps.plan.outputs.thread-sanitizer }}
      address-sanitizer: ${{ steps.plan.outputs.address-sanitizer }}
      package-builds: ${{ steps.plan.outputs.package-builds }}
      swift-syntax-compatibility: ${{ steps.plan.outputs.swift-syntax-compatibility }}
      plan: ${{ steps.plan.outputs.plan }}
      post_merge: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dependabot_merge_pr != '')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify actual post-merge main origin
        if: inputs.dependabot_merge_pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MERGED_PR: ${{ inputs.dependabot_merge_pr }}
          EVENT_REF: ${{ github.ref }}
        run: |
          [[ "$EVENT_REF" == 'refs/heads/main' ]] || { echo 'Recovery must run on main.' >&2; exit 1; }
          python3 -B scripts/dependabot-merge-policy.py verify-post-merge --pr "$MERGED_PR" --expected-sha "$GITHUB_SHA"
      - name: Admit exact-tree PR verification
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        # GET-only metadata; unknown evidence selects the complete original CI.
        run: python3 -B scripts/main-ci-reuse-policy.py --event "$GITHUB_EVENT_PATH"
      - name: Plan exact changed paths
        id: plan
        env:
          CI_REUSE: ${{ steps.reuse.outputs.proof }}
        run: python3 -B scripts/ci-policy.py plan --event "$GITHUB_EVENT_PATH" --output .build/ci-plan.json
      - name: Preserve change selection evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-plan-${{ github.sha }}-${{ github.run_attempt }}
          path: .build/ci-plan.json
          if-no-files-found: error

  policy:
    name: CI and public operations policy
    needs: ci-plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify CI selection and public operations
        run: |
          python3 -B -m unittest discover -s scripts/tests -p 'test_*.py'
          python3 -B scripts/check-public-operations.py
          python3 -B scripts/check-ci-workflows.py
          scripts/check-workflow-action-pins.sh
          scripts/check-workflow-job-timeouts.sh
          scripts/check-validation-prerequisites-selftest.sh
          python3 scripts/check-testing-contracts-selftest.py
          ruby scripts/check-ci-efficiency.rb
          scripts/check-ci-efficiency-selftest.sh
          ruby scripts/check-coverage-workflow.rb
          bash scripts/check-coverage-workflow-selftest.sh
          scripts/check-macro-operations.sh
          scripts/check-community-health.sh

  documentation:
    name: Documentation
    needs: ci-plan
    if: fromJSON(needs.ci-plan.outputs.plan).jobs.documentation
    uses: ./.github/workflows/docs.yml
    with:
      publish_pages: ${{ needs.ci-plan.outputs.post_merge == 'true' }}

  # Preserve the existing main ruleset context without changing live settings.
  docs-required:
    name: Build Documentation
    if: ${{ always() }}
    needs: [ci-plan, documentation]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require planned documentation result
        if: ${{ !(github.event_name == 'pull_request' && (((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name && github.event.label.name != 'release-validation' && github.event.label.name != 'run-asan') || (github.event.action == 'edited' && !github.event.changes.base))) }}
        env:
          CI_PLAN: ${{ needs.ci-plan.outputs.plan }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 -B scripts/ci-policy.py evaluate-documentation
      - name: Verify prior validation for metadata
        if: ${{ (github.event_name == 'pull_request' && (((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name && github.event.label.name != 'release-validation' && github.event.label.name != 'run-asan') || (github.event.action == 'edited' && !github.event.changes.base))) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/metadata_wait.py -- python3 -B scripts/verify-ci-metadata.py --check 'Build Documentation'

  coverage:
    name: Coverage Gate
    needs: ci-plan
    if: fromJSON(needs.ci-plan.outputs.plan).jobs.coverage
    uses: ./.github/workflows/coverage.yml

  lint:
    name: Lint
    needs: ci-plan
    if: fromJSON(needs.ci-plan.outputs.plan).jobs.lint
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Verify CI-only release evidence contracts
        run: |
          set -euo pipefail
          python3 -B scripts/ci-test-targets.py verify
          scripts/check-release-evidence-workflow-selftest.sh
          scripts/write-github-evidence-provenance-selftest.sh
          scripts/run-release-preflight-selftest.sh
          ruby scripts/hosted-release-preflight-selftest.rb

      - name: Lint sources
        run: |
          set -eo pipefail
          xcrun swift --version
          # Pin swift-format major version so style drift surfaces as a lint
          # failure rather than silently re-formatting under a newer toolchain.
          SWIFT_FORMAT_VERSION_OUTPUT="$(swift format --version)"
          SWIFT_FORMAT_VERSION="$(
            printf '%s\n' "${SWIFT_FORMAT_VERSION_OUTPUT}" |
              awk '{ for (i = 1; i <= NF; i++) if ($i ~ /^[0-9]+([.][0-9]+)*$/) { print $i; exit } }'
          )"
          echo "swift-format: ${SWIFT_FORMAT_VERSION_OUTPUT}"
          case "${SWIFT_FORMAT_VERSION}" in
            6.*|60[0-9].*) ;;
            *)
              echo "::error::Unsupported swift-format version ${SWIFT_FORMAT_VERSION_OUTPUT} (expected 6.x or 60x.x)"
              exit 1
              ;;
          esac
          swift format lint --strict --recursive Sources Tests Examples

      - name: Check Swift documentation fence syntax
        run: '"$GITHUB_WORKSPACE/scripts/check-doc-swift-syntax.rb"'

      - name: Require complete documentation example inventory
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/scripts/report-doc-fence-review.rb" --require-complete
          ruby "$GITHUB_WORKSPACE/scripts/report-doc-fence-review-selftest.rb"

      - name: Compile copyable documentation examples as external consumers
        run: '"$GITHUB_WORKSPACE/scripts/check-doc-copyable-examples.rb"'

  tests:
    name: Package Tests (Core)
    runs-on: macos-26
    timeout-minutes: 60
    needs: ci-plan
    if: needs.ci-plan.outputs.tests == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Fingerprint exact cache inputs
        id: cache-inputs
        run: python3 -B scripts/ci-cache.py fingerprint --profile tests
      - name: Restore SwiftPM dependency cache
        id: dependency-cache
        # Mirrors/downloaded prebuilts only; no .build products or verdicts.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache-inputs.outputs.dependency-paths }}
          key: ${{ steps.cache-inputs.outputs.dependency-key }}
      - name: Observe restored cache inputs
        env:
          DEPENDENCY_CACHE_HIT: ${{ steps.dependency-cache.outputs.cache-hit }}
        run: python3 -B scripts/ci-cache.py restored --profile tests

      - name: Select dependency-complete package tests
        id: test-selection
        env:
          CI_PLAN: ${{ needs.ci-plan.outputs.plan }}
        run: python3 -B scripts/ci-test-targets.py select

      - name: Verify macro source fallback
        run: |
          set -eo pipefail
          swift build \
            --package-path "$GITHUB_WORKSPACE" \
            --product InnoFlow \
            --disable-experimental-prebuilts \
            --jobs 1 \
            -Xswiftc -warnings-as-errors

      - name: Run package tests including output lifetime and composition contracts
        env:
          CI_PLAN: ${{ needs.ci-plan.outputs.plan }}
        run: |
          set -eo pipefail
          # Randomized effect suites can otherwise starve unrelated
          # MainActor-bound timeout tests on shared macOS runners.
          # Keep the full suite: captured-output cancellation, Never promotion,
          # and non-equatable output matching are required release contracts.
          # Include cancellation between emission, reduction, and observation.
          if [[ '${{ steps.test-selection.outputs.mode }}' == 'full' ]]; then
            swift test \
              --package-path "$GITHUB_WORKSPACE" \
              --jobs 1 \
              --no-parallel \
              -Xswiftc -warnings-as-errors
          else
            python3 -B scripts/ci-test-targets.py run
          fi

      - name: Require complete package suite for main reuse
        if: steps.test-selection.outputs.mode == 'full'
        env:
          CI_PLAN: ${{ needs.ci-plan.outputs.plan }}
        run: python3 -B scripts/ci-test-targets.py assert-full

      - name: Report cache observations
        if: always()
        # Observation failures are blocking, even when validation already failed.
        run: python3 -B scripts/ci-cache.py report --profile tests

  release-tests:
    name: Package Tests (Release)
    runs-on: macos-26
    timeout-minutes: 90
    needs: ci-plan
    if: needs.ci-plan.outputs.release-tests == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Fingerprint exact cache inputs
        id: cache-inputs
        run: python3 -B scripts/ci-cache.py fingerprint --profile release-tests
      - name: Restore SwiftPM dependency cache
        id: dependency-cache
        # Mirrors/downloaded prebuilts only; no .build products or verdicts.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache-inputs.outputs.dependency-paths }}
          key: ${{ steps.cache-inputs.outputs.dependency-key }}
      - name: Observe restored cache inputs
        env:
          DEPENDENCY_CACHE_HIT: ${{ steps.dependency-cache.outputs.cache-hit }}
        run: python3 -B scripts/ci-cache.py restored --profile release-tests

      - name: Run release configuration checks
        run: '"$GITHUB_WORKSPACE/scripts/check-release-configuration.sh"'

      - name: Report cache observations
        if: always()
        # Observation failures are blocking, even when validation already failed.
        run: python3 -B scripts/ci-cache.py report --profile release-tests

  api-compatibility:
    name: Public API Compatibility
    runs-on: macos-26
    timeout-minutes: 45
    needs: ci-plan
    if: fromJSON(needs.ci-plan.outputs.plan).jobs.api-compatibility

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Fingerprint exact cache inputs
        id: cache-inputs
        run: python3 -B scripts/ci-cache.py fingerprint --profile api-compatibility
      - name: Restore SwiftPM dependency cache
        id: dependency-cache
        # Mirrors/downloaded prebuilts only; no .build products or verdicts.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache-inputs.outputs.dependency-paths }}
          key: ${{ steps.cache-inputs.outputs.dependency-key }}
      - name: Observe restored cache inputs
        env:
          DEPENDENCY_CACHE_HIT: ${{ steps.dependency-cache.outputs.cache-hit }}
        run: python3 -B scripts/ci-cache.py restored --profile api-compatibility

      - name: Check compatibility with the 6.0 public baseline
        run: '"$GITHUB_WORKSPACE/scripts/check-api-compatibility.sh"'

      - name: Run 5.1.1 to 6.0 external migration consumer
        run: '"$GITHUB_WORKSPACE/scripts/check-migration-consumer.sh"'

      - name: Report cache observations
        if: always()
        # Observation failures are blocking, even when validation already failed.
        run: python3 -B scripts/ci-cache.py report --profile api-compatibility

  thread-sanitizer:
    name: Package Tests (ThreadSanitizer)
    runs-on: macos-26
    timeout-minutes: 60
    needs: ci-plan
    if: needs.ci-plan.outputs.thread-sanitizer == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Fingerprint exact cache inputs
        id: cache-inputs
        run: python3 -B scripts/ci-cache.py fingerprint --profile thread-sanitizer
      - name: Restore SwiftPM dependency cache
        id: dependency-cache
        # Mirrors/downloaded prebuilts only; no .build products or verdicts.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache-inputs.outputs.dependency-paths }}
          key: ${{ steps.cache-inputs.outputs.dependency-key }}
      - name: Observe restored cache inputs
        env:
          DEPENDENCY_CACHE_HIT: ${{ steps.dependency-cache.outputs.cache-hit }}
        run: python3 -B scripts/ci-cache.py restored --profile thread-sanitizer

      - name: Run package tests with ThreadSanitizer
        run: |
          set -eo pipefail
          swift test \
            --package-path "$GITHUB_WORKSPACE" \
            --sanitize=thread \
            --no-parallel \
            -Xswiftc -warnings-as-errors

      - name: Report cache observations
        if: always()
        # Observation failures are blocking, even when validation already failed.
        run: python3 -B scripts/ci-cache.py report --profile thread-sanitizer

  sample-tests:
    name: Package Tests (Sample)
    runs-on: macos-26
    timeout-minutes: 30
    needs: ci-plan
    if: fromJSON(needs.ci-plan.outputs.plan).jobs.sample-tests

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Fingerprint exact cache inputs
        id: cache-inputs
        run: python3 -B scripts/ci-cache.py fingerprint --profile sample-tests
      - name: Restore SwiftPM dependency cache
        id: dependency-cache
        # Mirrors/downloaded prebuilts only; no .build products or verdicts.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache-inputs.outputs.dependency-paths }}
          key: ${{ steps.cache-inputs.outputs.dependency-key }}
      - name: Observe restored cache inputs
        env:
          DEPENDENCY_CACHE_HIT: ${{ steps.dependency-cache.outputs.cache-hit }}
        run: python3 -B scripts/ci-cache.py restored --profile sample-tests

      - name: Run sample package tests
        run: |
          set -eo pipefail
          swift test --package-path "$GITHUB_WORKSPACE/Examples/InnoFlowSampleApp/InnoFlowSampleAppPackage" --disable-automatic-resolution --jobs 1 -Xswiftc -warnings-as-errors

      - name: Report cache observations
        if: always()
        # Observation failures are blocking, even when validation already failed.
        run: python3 -B scripts/ci-cache.py report --profile sample-tests

  package-builds:
    name: Package Build (${{ matrix.platform }})
    runs-on: macos-26
    timeout-minutes: 30
    needs: ci-plan
    if: needs.ci-plan.outputs.package-builds == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: [macOS, iOS, tvOS, watchOS, visionOS]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Fingerprint exact cache inputs
        id: cache-inputs
        run: python3 -B scripts/ci-cache.py fingerprint --profile package-builds --variant '${{ matrix.platform }}'
      - name: Restore SwiftPM dependency cache
        id: dependency-cache
        # Mirrors/downloaded prebuilts only; no .build products or verdicts.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache-inputs.outputs.dependency-paths }}
          key: ${{ steps.cache-inputs.outputs.dependency-key }}
      - name: Observe restored cache inputs
        env:
          DEPENDENCY_CACHE_HIT: ${{ steps.dependency-cache.outputs.cache-hit }}
        run: python3 -B scripts/ci-cache.py restored --profile package-builds --variant '${{ matrix.platform }}'

      - name: Build package scheme for ${{ matrix.platform }}
        env:
          CI_PLAN: ${{ needs.ci-plan.outputs.plan }}
        run: python3 -B scripts/ci-build-products.py --platform '${{ matrix.platform }}'

      - name: Report cache observations
        if: always()
        # Observation failures are blocking, even when validation already failed.
        run: python3 -B scripts/ci-cache.py report --profile package-builds --variant '${{ matrix.platform }}'

  focused-runtime-tests:
    name: Focused Runtime Tests (${{ matrix.platform }})
    runs-on: macos-26
    timeout-minutes: 60
    needs: ci-plan
    if: fromJSON(needs.ci-plan.outputs.plan).jobs.focused-runtime-tests
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, tvOS, watchOS, visionOS]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Xcode version
        run: |
          xcodebuild -version
          swift --version

      - name: Fingerprint exact cache inputs
        id: cache-inputs
        run: python3 -B scripts/ci-cache.py fingerprint --profile focused-runtime-tests --variant '${{ matrix.platform }}'
      - name: Restore SwiftPM dependency cache
        id: dependency-cache
        # Mirrors/downloaded prebuilts only; no .build products or verdicts.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache-inputs.outputs.dependency-paths }}
          key: ${{ steps.cache-inputs.outputs.dependency-key }}
      - name: Observe restored cache inputs
        env:
          DEPENDENCY_CACHE_HIT: ${{ steps.dependency-cache.outputs.cache-hit }}
        run: python3 -B scripts/ci-cache.py restored --profile focused-runtime-tests --variant '${{ matrix.platform }}'

      - name: Run focused scheduler, scope, diagnostics, and Output tests
        run: |
          set -eo pipefail
          "$GITHUB_WORKSPACE/scripts/run-focused-platform-runtime-matrix.sh" \
            --platform "${{ matrix.platform }}" \
            --result-bundle "$RUNNER_TEMP/focused-runtime-${{ matrix.platform }}.xcresult"

      - name: Preserve failed focused runtime results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: focused-runtime-${{ matrix.platform }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/focused-runtime-${{ matrix.platform }}.xcresult
          retention-days: 7
          if-no-files-found: warn

      - name: Report cache observations
        if: always()
        # Observation failures are blocking, even when validation already failed.
        run: python3 -B scripts/ci-cache.py report --profile focused-runtime-tests --variant '${{ matrix.platform }}'

  principle-gates:
    # Keep the existing check name; independent consumer compilation is an added step.
    name: Principle Gates (Static)
    runs-on: macos-26
    timeout-minutes: 90
    needs: ci-plan
    if: fromJSON(needs.ci-plan.outputs.plan).jobs.principle-gates

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Select supported Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: '3.4.4'

      - name: Run static principle gates
        run: |
          set -eo pipefail
          "$GITHUB_WORKSPACE/scripts/principle-gates.sh" --static

      - name: Verify gate negative controls
        run: '"$GITHUB_WORKSPACE/scripts/principle-gates-selftest.sh"'

      - name: Verify independent public API and AST migration consumers
        run: '"$GITHUB_WORKSPACE/scripts/check-independent-consumers.sh"'

  sample-package-builds:
    name: Sample Package Build (${{ matrix.platform }})
    runs-on: macos-26
    timeout-minutes: 30
    needs: ci-plan
    if: fromJSON(needs.ci-plan.outputs.plan).jobs.sample-package-builds
    strategy:
      fail-fast: false
      matrix:
        platform: [tvOS, watchOS, visionOS]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Fingerprint exact cache inputs
        id: cache-inputs
        run: python3 -B scripts/ci-cache.py fingerprint --profile sample-package-builds --variant '${{ matrix.platform }}'
      - name: Restore SwiftPM dependency cache
        id: dependency-cache
        # Mirrors/downloaded prebuilts only; no .build products or verdicts.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache-inputs.outputs.dependency-paths }}
          key: ${{ steps.cache-inputs.outputs.dependency-key }}
      - name: Observe restored cache inputs
        env:
          DEPENDENCY_CACHE_HIT: ${{ steps.dependency-cache.outputs.cache-hit }}
        run: python3 -B scripts/ci-cache.py restored --profile sample-package-builds --variant '${{ matrix.platform }}'

      - name: Build sample package for ${{ matrix.platform }}
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE/Examples/InnoFlowSampleApp/InnoFlowSampleAppPackage"
          xcodebuild \
            -jobs 1 \
            -scheme InnoFlowSampleAppFeature \
            -disableAutomaticPackageResolution \
            -destination 'generic/platform=${{ matrix.platform }}' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Report cache observations
        if: always()
        # Observation failures are blocking, even when validation already failed.
        run: python3 -B scripts/ci-cache.py report --profile sample-package-builds --variant '${{ matrix.platform }}'

  sample-build:
    name: Canonical Sample Build
    runs-on: macos-26
    timeout-minutes: 30
    needs: ci-plan
    if: fromJSON(needs.ci-plan.outputs.plan).jobs.sample-build

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Fingerprint exact cache inputs
        id: cache-inputs
        run: python3 -B scripts/ci-cache.py fingerprint --profile sample-build
      - name: Restore SwiftPM dependency cache
        id: dependency-cache
        # Mirrors/downloaded prebuilts only; no .build products or verdicts.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache-inputs.outputs.dependency-paths }}
          key: ${{ steps.cache-inputs.outputs.dependency-key }}
      - name: Observe restored cache inputs
        env:
          DEPENDENCY_CACHE_HIT: ${{ steps.dependency-cache.outputs.cache-hit }}
        run: python3 -B scripts/ci-cache.py restored --profile sample-build

      - name: Build canonical sample
        run: |
          set -eo pipefail
          xcodebuild \
            -jobs 1 \
            -project "$GITHUB_WORKSPACE/Examples/InnoFlowSampleApp/InnoFlowSampleApp.xcodeproj" \
            -scheme InnoFlowSampleApp \
            -disableAutomaticPackageResolution \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Report cache observations
        if: always()
        # Observation failures are blocking, even when validation already failed.
        run: python3 -B scripts/ci-cache.py report --profile sample-build

  address-sanitizer:
    name: Package Tests (AddressSanitizer)
    runs-on: macos-26
    timeout-minutes: 60
    needs: ci-plan
    if: needs.ci-plan.outputs.address-sanitizer == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Fingerprint exact cache inputs
        id: cache-inputs
        run: python3 -B scripts/ci-cache.py fingerprint --profile address-sanitizer
      - name: Restore SwiftPM dependency cache
        id: dependency-cache
        # Mirrors/downloaded prebuilts only; no .build products or verdicts.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache-inputs.outputs.dependency-paths }}
          key: ${{ steps.cache-inputs.outputs.dependency-key }}
      - name: Observe restored cache inputs
        env:
          DEPENDENCY_CACHE_HIT: ${{ steps.dependency-cache.outputs.cache-hit }}
        run: python3 -B scripts/ci-cache.py restored --profile address-sanitizer

      - name: Run package tests with AddressSanitizer
        run: |
          set -eo pipefail
          swift test \
            --package-path "$GITHUB_WORKSPACE" \
            --sanitize=address \
            --no-parallel \
            -Xswiftc -warnings-as-errors

      - name: Report cache observations
        if: always()
        # Observation failures are blocking, even when validation already failed.
        run: python3 -B scripts/ci-cache.py report --profile address-sanitizer

  sample-ui-tests:
    name: Canonical Sample UI Smoke Tests
    runs-on: macos-26
    timeout-minutes: 60
    needs: ci-plan
    if: fromJSON(needs.ci-plan.outputs.plan).jobs.sample-ui-tests

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Fingerprint exact cache inputs
        id: cache-inputs
        run: python3 -B scripts/ci-cache.py fingerprint --profile sample-ui-tests
      - name: Restore SwiftPM dependency cache
        id: dependency-cache
        # Mirrors/downloaded prebuilts only; no .build products or verdicts.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache-inputs.outputs.dependency-paths }}
          key: ${{ steps.cache-inputs.outputs.dependency-key }}
      - name: Observe restored cache inputs
        env:
          DEPENDENCY_CACHE_HIT: ${{ steps.dependency-cache.outputs.cache-hit }}
        run: python3 -B scripts/ci-cache.py restored --profile sample-ui-tests

      - name: Resolve iOS simulator destination
        id: ios-simulator
        run: |
          set -eo pipefail
          IOS_SIMULATOR_UDID="$(
            xcrun simctl list devices available -j | /usr/bin/python3 -c '
          import json
          import re
          import sys

          data = json.load(sys.stdin)["devices"]
          candidates = []
          for runtime, devices in data.items():
              if "iOS" not in runtime:
                  continue
              match = re.search(r"iOS[- ](\d+)(?:[-.](\d+))?", runtime)
              if not match:
                  continue
              version = (int(match.group(1)), int(match.group(2) or 0))
              for device in devices:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      candidates.append((version, device["name"], device["udid"]))

          if not candidates:
              sys.exit(1)

          candidates.sort()
          print(candidates[-1][2])
          '
          )"
          if [[ -z "$IOS_SIMULATOR_UDID" ]]; then
            echo "Unable to resolve an available iPhone simulator" >&2
            exit 1
          fi
          echo "udid=$IOS_SIMULATOR_UDID" >> "$GITHUB_OUTPUT"

      - name: Preboot iOS simulator
        run: |
          set -eo pipefail
          xcrun simctl bootstatus "${{ steps.ios-simulator.outputs.udid }}" -b

      - name: Run canonical sample UI smoke tests
        run: |
          set -eo pipefail
          xcodebuild \
            -jobs 1 \
            -parallel-testing-enabled NO \
            -project "$GITHUB_WORKSPACE/Examples/InnoFlowSampleApp/InnoFlowSampleApp.xcodeproj" \
            -scheme InnoFlowSampleApp \
            -disableAutomaticPackageResolution \
            -destination "platform=iOS Simulator,id=${{ steps.ios-simulator.outputs.udid }}" \
            -only-testing:InnoFlowSampleAppUITests \
            -resultBundlePath "$RUNNER_TEMP/sample-ui-results.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test

      - name: Preserve canonical sample UI results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sample-ui-results-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sample-ui-results.xcresult
          if-no-files-found: error
          retention-days: 7

      - name: Report cache observations
        if: always()
        # Observation failures are blocking, even when validation already failed.
        run: python3 -B scripts/ci-cache.py report --profile sample-ui-tests

  swift-syntax-compatibility:
    name: SwiftSyntax Compatibility (Swift ${{ matrix.swift }}, ${{ matrix.syntax }})
    needs: ci-plan
    if: needs.ci-plan.outputs.swift-syntax-compatibility == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            xcode: '26.6'
            swift: '6.3'
            syntax: '603.0.0'
            revision: '2b59c0c741e9184ab057fd22950b491076d42e91'
          - runner: xcode-27
            xcode: '27.0'
            swift: '6.4'
            syntax: '604.0.0'
            revision: '050f1a346fbbac0ca2cfb15a95274f7bd1cf0ccf'
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      SWIFT_LINE: ${{ matrix.swift }}
      SYNTAX_VERSION: ${{ matrix.syntax }}
      SYNTAX_REVISION: ${{ matrix.revision }}
    steps:
      - name: Checkout exact compatibility candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify pinned compatibility toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          # Apple omits the patch component for initial releases (for example 6.4).
          swift --version | awk -v expected="$SWIFT_LINE" '
            $1 == "Apple" && $2 == "Swift" && $3 == "version" {
              split($4, version, ".")
              if (version[1] "." version[2] == expected) found = 1
            }
            END { exit !found }
          '
      - name: Resolve and verify audited SwiftSyntax
        run: |
          set -euo pipefail
          swift package resolve
          swift package resolve swift-syntax --version "$SYNTAX_VERSION"
          python3 - <<'PYTHON'
          import json, os
          matches = [p for p in json.load(open('Package.resolved'))['pins'] if p['identity'] == 'swift-syntax']
          assert len(matches) == 1, matches
          assert matches[0]['state']['version'] == os.environ['SYNTAX_VERSION'], matches
          assert matches[0]['state']['revision'] == os.environ['SYNTAX_REVISION'], matches
          PYTHON
      - name: Fingerprint exact cache inputs
        id: cache-inputs
        run: python3 -B scripts/ci-cache.py fingerprint --profile swift-syntax-compatibility --variant '${{ matrix.syntax }}'
      - name: Restore SwiftPM dependency cache
        id: dependency-cache
        # Mirrors/downloaded prebuilts only; no .build products or verdicts.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache-inputs.outputs.dependency-paths }}
          key: ${{ steps.cache-inputs.outputs.dependency-key }}
      - name: Observe restored cache inputs
        env:
          DEPENDENCY_CACHE_HIT: ${{ steps.dependency-cache.outputs.cache-hit }}
        run: python3 -B scripts/ci-cache.py restored --profile swift-syntax-compatibility --variant '${{ matrix.syntax }}'

      - name: Test macro and external compile contracts
        run: |
          set -euo pipefail
          swift test --jobs 1 --no-parallel -Xswiftc -warnings-as-errors \
            --filter 'InnoFlowMacrosTests|CompileContractTests'
          # Compile the Sendable key-path migration against both audited compilers.
          "$GITHUB_WORKSPACE/scripts/check-collection-lifetime-consumer.sh"

      - name: Verify AST migration on the audited SwiftSyntax line
        env:
          INNOFLOW_MIGRATE_SWIFT_SYNTAX_VERSION: ${{ matrix.syntax }}
        run: '"$GITHUB_WORKSPACE/Tools/innoflow-migrate/scripts/check.sh"'

      - name: Verify selective test package on the audited compiler
        run: |
          set -euo pipefail
          python3 -B scripts/ci-test-targets.py verify
          # Regular fixture modules must also compile without product testability.
          swift build --configuration release --jobs 1 -Xswiftc -warnings-as-errors
          selected="$RUNNER_TEMP/innoflow-inspector-${{ matrix.swift }}"
          python3 -B scripts/ci-test-targets.py prepare \
            --targets InnoFlowInspectorTests --destination "$selected"
          swift test --package-path "$selected" --jobs 1 --no-parallel \
            -Xswiftc -warnings-as-errors

      - name: Report cache observations
        if: always()
        # Observation failures are blocking, even when validation already failed.
        run: python3 -B scripts/ci-cache.py report --profile swift-syntax-compatibility --variant '${{ matrix.syntax }}'

  ci-required:
    name: CI Required
    if: ${{ always() }}
    needs:
      - ci-plan
      - policy
      - docs-required
      - documentation
      - coverage
      - lint
      - tests
      - release-tests
      - api-compatibility
      - thread-sanitizer
      - sample-tests
      - package-builds
      - focused-runtime-tests
      - principle-gates
      - sample-package-builds
      - sample-build
      - address-sanitizer
      - sample-ui-tests
      - swift-syntax-compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require every planned CI result
        if: ${{ !(github.event_name == 'pull_request' && (((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name && github.event.label.name != 'release-validation' && github.event.label.name != 'run-asan') || (github.event.action == 'edited' && !github.event.changes.base))) }}
        env:
          GH_TOKEN: ${{ github.token }}
          CI_REUSE: ${{ needs.ci-plan.outputs.reuse-proof }}
          CI_PLAN: ${{ needs.ci-plan.outputs.plan }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 -B scripts/ci-policy.py evaluate
      - name: Verify prior validation for metadata
        if: ${{ (github.event_name == 'pull_request' && (((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name && github.event.label.name != 'release-validation' && github.event.label.name != 'run-asan') || (github.event.action == 'edited' && !github.event.changes.base))) }}
        env:
          GH_TOKEN: ${{ github.token }}
          INNO_METADATA_WAIT: ${{ needs.docs-required.result == 'success' && 'enabled' || 'disabled' }}
        run: python3 -B scripts/metadata_wait.py -- python3 -B scripts/verify-ci-metadata.py --check 'CI Required'
