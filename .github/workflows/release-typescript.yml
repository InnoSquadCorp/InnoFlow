name: Release TypeScript and React

on:
  push:
    tags:
      - 'npm/v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: release-typescript-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Install pinned npm
        run: npm install --global npm@11.19.0

      - name: Install and validate
        working-directory: typescript
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm test

      - name: Verify release versions
        if: github.ref_type == 'tag'
        working-directory: typescript
        run: |
          VERSION="${GITHUB_REF_NAME#npm/v}"
          node -e 'for (const path of ["packages/core/package.json", "packages/react/package.json", "packages/testing/package.json"]) { const pkg = require(`./${path}`); if (pkg.version !== process.argv[1]) throw new Error(`${path} is ${pkg.version}, expected ${process.argv[1]}`); }' "${VERSION}"

      - name: Verify packed browser consumers and value negative controls
        working-directory: typescript
        run: |
          npx --no-install playwright install chromium --only-shell --with-deps
          INNOFLOW_REACT_VERSION=18.2.0 npm run test:packed
          INNOFLOW_REACT_VERSION=19.2.8 npm run test:packed
          npm run test:packed:selftest

      - name: Require exact-SHA main CI including device and browser gates
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: python3 scripts/check-multiplatform-ci.py
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish public npm packages
        if: github.event_name == 'push' && github.ref_type == 'tag'
        working-directory: typescript
        run: |
          npm publish --workspace=@innosquad/inno-flow --access public --provenance
          npm publish --workspace=@innosquad/inno-flow-react --access public --provenance
          npm publish --workspace=@innosquad/inno-flow-testing --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify installation from the public npm registry
        if: github.event_name == 'push' && github.ref_type == 'tag'
        working-directory: typescript
        env:
          INNOFLOW_FROM_REGISTRY: "1"
        run: |
          npx --no-install playwright install chromium --only-shell --with-deps
          npm run test:packed
