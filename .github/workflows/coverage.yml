name: Coverage Gate

on:
  workflow_call:

permissions:
  contents: read

# A called workflow inherits github.workflow from its caller. The static
# prefix prevents this job from cancelling another reusable release gate.
concurrency:
  group: innoflow-coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Verify coverage negative controls
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/coverage-selftest.py
      - name: Measure and enforce coverage
        run: scripts/run-coverage.sh
      - name: Preserve coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: innoflow-coverage-${{ github.sha }}
          path: .build/coverage/
          if-no-files-found: error
          include-hidden-files: true
