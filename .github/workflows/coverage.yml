name: Coverage Gate

on:
  workflow_call:

permissions:
  contents: read

# A called workflow inherits github.workflow from its caller. The static
# prefix prevents this job from cancelling another reusable release gate.
concurrency:
  # A separately admitted recovery run must not cancel native push children.
  group: innoflow-coverage-${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Fingerprint exact cache inputs
        id: cache-inputs
        run: python3 -B scripts/ci-cache.py fingerprint --profile coverage
      - name: Restore SwiftPM dependency cache
        id: dependency-cache
        # Mirrors/downloaded prebuilts only; no .build products or verdicts.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache-inputs.outputs.dependency-paths }}
          key: ${{ steps.cache-inputs.outputs.dependency-key }}
      - name: Observe restored cache inputs
        env:
          DEPENDENCY_CACHE_HIT: ${{ steps.dependency-cache.outputs.cache-hit }}
        run: python3 -B scripts/ci-cache.py restored --profile coverage

      - name: Verify coverage negative controls
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/coverage-selftest.py
      - name: Measure and enforce coverage
        run: scripts/run-coverage.sh
      - name: Preserve coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: innoflow-coverage-${{ github.sha }}
          path: .build/coverage/
          if-no-files-found: error
          include-hidden-files: true

      - name: Report cache observations
        if: always()
        # Observation failures are blocking, even when validation already failed.
        run: python3 -B scripts/ci-cache.py report --profile coverage
