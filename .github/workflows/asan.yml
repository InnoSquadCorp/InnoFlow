name: Pull Request AddressSanitizer

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  address-sanitizer:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'run-asan') &&
      (github.event.action != 'labeled' || github.event.label.name == 'run-asan')
    name: Package Tests (AddressSanitizer)
    runs-on: macos-26
    timeout-minutes: 60
    concurrency:
      group: asan-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run package tests with AddressSanitizer
        run: |
          set -eo pipefail
          swift test \
            --package-path "$GITHUB_WORKSPACE" \
            --sanitize=address \
            --no-parallel \
            -Xswiftc -warnings-as-errors
