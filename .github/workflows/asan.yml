name: Manual AddressSanitizer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  address-sanitizer:
    name: Package Tests (AddressSanitizer)
    runs-on: macos-26
    timeout-minutes: 60
    concurrency:
      group: asan-manual-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run package tests with AddressSanitizer
        run: |
          set -eo pipefail
          swift test \
            --package-path "$GITHUB_WORKSPACE" \
            --sanitize=address \
            --no-parallel \
            -Xswiftc -warnings-as-errors
