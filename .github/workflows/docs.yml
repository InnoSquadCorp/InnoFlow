name: Documentation

on:
  push:
    branches: [ main ]
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

# Builds queue per ref (a newer push supersedes an in-flight build for the
# same ref); the shared "pages" group lives on the deploy job only, so PR
# builds that never deploy cannot delay a main-branch Pages deployment.
concurrency:
  group: "docs-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-docs:
    name: Build Documentation
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Build Documentation
      run: |
        echo "📚 Building DocC documentation..."

        chmod +x Tools/generate-docc.sh
        Tools/generate-docc.sh docs-build InnoFlow InnoFlow

        echo "✅ Documentation built successfully!"
    
    - name: Setup Pages
      if: ${{ github.event_name != 'pull_request' }}
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

    - name: Upload Documentation Artifact
      if: ${{ github.event_name != 'pull_request' }}
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: docs-build

  deploy-docs:
    name: Deploy Documentation
    if: ${{ github.event_name != 'pull_request' }}
    needs: build-docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: "pages"
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
