name: Documentation

on:
  workflow_call:
    inputs:
      publish_pages:
        description: Upload a Pages artifact only after the caller validates a main build
        type: boolean
        required: false
        default: false
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

# PR/main builds are owned by CI. A distinct reusable namespace avoids cancelling
# the caller; only the publisher shares the global Pages deployment queue.
concurrency:
  # A separately admitted recovery run must not cancel native push children.
  group: docs-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  build-docs:
    name: Build Documentation
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build Documentation
        run: |
          set -euo pipefail
          Tools/generate-docc.sh docs-build InnoFlow InnoFlow

      # The artifact is inert data. Only docs-publish.yml has Pages/OIDC write
      # permission, and it revalidates its origin, latest attempt and current main.
      - name: Upload Documentation Artifact
        if: >-
          (github.workflow == 'CI' && inputs.publish_pages == true && github.ref == 'refs/heads/main' &&
           (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) ||
          (github.workflow == 'Documentation' &&
           ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
            (github.event_name == 'workflow_dispatch' &&
             (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')))))
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: docs-build
          retention-days: 3
