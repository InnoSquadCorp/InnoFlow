name: Publish Documentation

on:
  workflow_run:
    workflows: [CI, Documentation]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy-docs:
    name: Deploy Documentation
    if: >-
      github.repository == 'InnoSquadCorp/InnoFlow' &&
      github.ref == 'refs/heads/main' &&
      github.workflow_ref == 'InnoSquadCorp/InnoFlow/.github/workflows/docs-publish.yml@refs/heads/main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      ((github.event.workflow_run.name == 'CI' && github.event.workflow_run.head_branch == 'main') ||
       github.event.workflow_run.name == 'Documentation')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Ineligible workflow_run notifications must not enter the Pages queue.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # workflow_run loads this workflow from main. Never check out the upstream
      # source head, download its artifact or execute a PR-controlled helper.
      - name: Checkout trusted publisher only
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts/publish-docs.py
          sparse-checkout-cone-mode: false

      - name: Verify origin and publish current-main documentation
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/publish-docs.py
